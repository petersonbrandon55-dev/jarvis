<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS HUD</title>
<style>
  /* ─── Reset & Base ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan:    #00e5ff;
    --green:   #00ff88;
    --yellow:  #ffd600;
    --blue:    #1565c0;
    --dim:     #0d47a1;
    --bg:      #0a0a0f;
    --panel:   rgba(0, 229, 255, 0.04);
    --border:  rgba(0, 229, 255, 0.15);
    --status-color: var(--dim);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--cyan);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    user-select: none;
  }

  /* ─── Scanline overlay ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,229,255,0.012) 3px,
      rgba(0,229,255,0.012) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* ─── Corner brackets ─── */
  .corner {
    position: fixed;
    width: 48px; height: 48px;
    border-color: rgba(0,229,255,0.35);
    border-style: solid;
    z-index: 10;
  }
  .corner.tl { top: 18px; left: 18px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 18px; right: 18px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 18px; left: 18px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 18px; right: 18px; border-width: 0 2px 2px 0; }

  /* ─── Layout ─── */
  #hud {
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    height: 100vh;
    padding: 32px 48px 24px;
    gap: 16px;
  }

  /* ─── Header ─── */
  #header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  #title {
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 900;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow:
      0 0 8px  var(--cyan),
      0 0 20px var(--cyan),
      0 0 48px rgba(0,229,255,0.6),
      0 0 80px rgba(0,229,255,0.25);
    animation: titlePulse 4s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan), 0 0 48px rgba(0,229,255,0.6), 0 0 80px rgba(0,229,255,0.25); }
    50%       { text-shadow: 0 0 4px var(--cyan), 0 0 12px var(--cyan), 0 0 28px rgba(0,229,255,0.4), 0 0 50px rgba(0,229,255,0.15); }
  }

  #subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: rgba(0,229,255,0.45);
    text-transform: uppercase;
  }

  /* ─── Status badge ─── */
  #status-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }

  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--status-color);
    box-shadow: 0 0 8px var(--status-color), 0 0 16px var(--status-color);
    transition: background 0.3s, box-shadow 0.3s;
  }

  #status-text {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--status-color);
    transition: color 0.3s;
    min-width: 90px;
  }

  /* ─── Center: arcs + orb ─── */
  #center {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #arc-container {
    position: relative;
    width: min(300px, 40vw);
    height: min(300px, 40vw);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arc-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid transparent;
  }

  /* Ring 1 — outermost */
  .arc-ring:nth-child(1) {
    width: 100%; height: 100%;
    border-top-color:    rgba(0,229,255,0.55);
    border-right-color:  rgba(0,229,255,0.18);
    border-bottom-color: rgba(0,229,255,0.08);
    border-left-color:   rgba(0,229,255,0.35);
    animation: spin1 6s linear infinite;
  }
  /* Ring 2 */
  .arc-ring:nth-child(2) {
    width: 80%; height: 80%;
    border-top-color:    rgba(0,229,255,0.0);
    border-right-color:  rgba(0,229,255,0.6);
    border-bottom-color: rgba(0,229,255,0.35);
    border-left-color:   rgba(0,229,255,0.1);
    animation: spin2 4.2s linear infinite reverse;
  }
  /* Ring 3 */
  .arc-ring:nth-child(3) {
    width: 62%; height: 62%;
    border-top-color:    rgba(0,229,255,0.4);
    border-right-color:  rgba(0,229,255,0.08);
    border-bottom-color: rgba(0,229,255,0.55);
    border-left-color:   rgba(0,229,255,0.2);
    animation: spin1 3s linear infinite;
  }
  /* Ring 4 — innermost */
  .arc-ring:nth-child(4) {
    width: 44%; height: 44%;
    border-top-color:    rgba(0,229,255,0.0);
    border-right-color:  rgba(0,229,255,0.7);
    border-bottom-color: rgba(0,229,255,0.0);
    border-left-color:   rgba(0,229,255,0.4);
    animation: spin2 2s linear infinite;
  }

  @keyframes spin1 { to { transform: rotate(360deg); } }
  @keyframes spin2 { to { transform: rotate(-360deg); } }

  /* Orb core */
  #orb {
    position: absolute;
    width: 28%; height: 28%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%,
      rgba(0,229,255,0.85) 0%,
      rgba(0,180,255,0.5)  30%,
      rgba(0,100,200,0.25) 65%,
      rgba(0,20,60,0.6)    100%
    );
    box-shadow:
      0 0 16px  rgba(0,229,255,0.8),
      0 0 40px  rgba(0,229,255,0.45),
      0 0 80px  rgba(0,229,255,0.2);
    animation: orbPulse 2.5s ease-in-out infinite;
  }

  @keyframes orbPulse {
    0%, 100% {
      box-shadow: 0 0 16px rgba(0,229,255,0.8), 0 0 40px rgba(0,229,255,0.45), 0 0 80px rgba(0,229,255,0.2);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 0 24px rgba(0,229,255,1), 0 0 60px rgba(0,229,255,0.6), 0 0 110px rgba(0,229,255,0.3);
      transform: scale(1.06);
    }
  }

  /* Listening state — rings speed up + turn green */
  body.listening .arc-ring:nth-child(1) { animation-duration: 2s;   border-top-color: rgba(0,255,136,0.7); border-left-color: rgba(0,255,136,0.4); }
  body.listening .arc-ring:nth-child(2) { animation-duration: 1.4s; border-right-color: rgba(0,255,136,0.8); border-bottom-color: rgba(0,255,136,0.45); }
  body.listening .arc-ring:nth-child(3) { animation-duration: 1s;   border-top-color: rgba(0,255,136,0.5); border-bottom-color: rgba(0,255,136,0.7); }
  body.listening .arc-ring:nth-child(4) { animation-duration: 0.7s; border-right-color: rgba(0,255,136,0.9); border-left-color: rgba(0,255,136,0.5); }
  body.listening #orb {
    background: radial-gradient(circle at 38% 35%,
      rgba(0,255,136,0.9) 0%, rgba(0,200,100,0.55) 35%,
      rgba(0,120,60,0.25) 65%, rgba(0,20,10,0.5) 100%
    );
    animation: orbListening 0.8s ease-in-out infinite;
  }
  @keyframes orbListening {
    0%,100% { box-shadow: 0 0 20px rgba(0,255,136,0.9), 0 0 50px rgba(0,255,136,0.55), 0 0 100px rgba(0,255,136,0.25); transform: scale(1); }
    50%     { box-shadow: 0 0 32px rgba(0,255,136,1),   0 0 80px rgba(0,255,136,0.7),  0 0 140px rgba(0,255,136,0.4);  transform: scale(1.12); }
  }

  /* Thinking state — yellow */
  body.thinking .arc-ring:nth-child(1) { animation-duration: 3s;   border-top-color: rgba(255,214,0,0.55); }
  body.thinking .arc-ring:nth-child(2) { animation-duration: 2.1s; border-right-color: rgba(255,214,0,0.65); }
  body.thinking .arc-ring:nth-child(3) { animation-duration: 1.5s; border-bottom-color: rgba(255,214,0,0.7); }
  body.thinking .arc-ring:nth-child(4) { animation-duration: 1s;   border-right-color: rgba(255,214,0,0.8); }
  body.thinking #orb {
    background: radial-gradient(circle at 38% 35%,
      rgba(255,220,50,0.85) 0%, rgba(200,160,0,0.5) 35%,
      rgba(120,80,0,0.25) 65%, rgba(30,20,0,0.6) 100%
    );
    animation: orbThinking 1.4s ease-in-out infinite;
  }
  @keyframes orbThinking {
    0%,100% { box-shadow: 0 0 18px rgba(255,214,0,0.8), 0 0 45px rgba(255,214,0,0.4), 0 0 90px rgba(255,214,0,0.15); transform: scale(1); }
    50%     { box-shadow: 0 0 28px rgba(255,214,0,1),   0 0 65px rgba(255,214,0,0.6), 0 0 120px rgba(255,214,0,0.3);  transform: scale(1.08); }
  }

  /* Speaking state — cyan (same as default but more intense) */
  body.speaking .arc-ring:nth-child(1) { animation-duration: 4s; }
  body.speaking .arc-ring:nth-child(2) { animation-duration: 2.8s; }
  body.speaking #orb { animation: orbSpeaking 1.1s ease-in-out infinite; }
  @keyframes orbSpeaking {
    0%,100% { box-shadow: 0 0 20px rgba(0,229,255,1), 0 0 55px rgba(0,229,255,0.6), 0 0 100px rgba(0,229,255,0.3); transform: scale(1); }
    50%     { box-shadow: 0 0 30px rgba(0,229,255,1), 0 0 80px rgba(0,229,255,0.8), 0 0 150px rgba(0,229,255,0.4);  transform: scale(1.1); }
  }

  /* ─── Side panels (flanking the arc) ─── */
  #panels {
    position: absolute;
    display: flex;
    justify-content: space-between;
    width: min(720px, 80vw);
    pointer-events: none;
  }

  .side-panel {
    width: 150px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    opacity: 0.55;
  }

  .panel-line {
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    color: var(--cyan);
    border-left: 2px solid rgba(0,229,255,0.3);
    padding-left: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .side-panel.right .panel-line { border-left: none; border-right: 2px solid rgba(0,229,255,0.3); padding-left: 0; padding-right: 6px; text-align: right; }

  /* ─── Waveform ─── */
  #waveform-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  #waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 48px;
  }

  .bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(to top, rgba(0,229,255,0.2), rgba(0,229,255,0.8));
    transform-origin: bottom center;
    transition: background 0.3s;
  }

  /* Idle: all bars flat */
  .bar { height: 3px; animation: none; }

  /* Listening: bars animate */
  body.listening  .bar { animation: wave var(--dur, 0.8s) ease-in-out infinite alternate; background: linear-gradient(to top, rgba(0,255,136,0.2), rgba(0,255,136,0.9)); }
  body.thinking   .bar { animation: waveSlow var(--dur, 1.4s) ease-in-out infinite alternate; background: linear-gradient(to top, rgba(255,214,0,0.2), rgba(255,214,0,0.85)); }
  body.speaking   .bar { animation: wave var(--dur, 0.6s) ease-in-out infinite alternate; background: linear-gradient(to top, rgba(0,229,255,0.2), rgba(0,229,255,0.95)); }

  @keyframes wave {
    from { height: 3px; }
    to   { height: var(--h, 30px); }
  }
  @keyframes waveSlow {
    from { height: 3px; }
    to   { height: calc(var(--h, 20px) * 0.6); }
  }

  /* ─── Conversation log ─── */
  #log-section {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 4px;
    padding: 10px 14px;
    max-height: 180px;
    overflow: hidden;
    position: relative;
  }

  #log-label {
    font-size: 0.55rem;
    letter-spacing: 0.25em;
    color: rgba(0,229,255,0.4);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  #log {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .log-entry {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 8px;
    font-size: 0.68rem;
    line-height: 1.4;
    opacity: 0;
    animation: fadeIn 0.4s forwards;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .log-role {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-top: 1px;
  }
  .log-role.user   { color: rgba(0,229,255,0.5); }
  .log-role.jarvis { color: rgba(0,229,255,0.9); text-shadow: 0 0 6px rgba(0,229,255,0.5); }

  .log-text {
    color: rgba(0,229,255,0.75);
    word-break: break-word;
  }
  .log-entry.jarvis-entry .log-text { color: rgba(200,240,255,0.9); }

  /* Fade-out top entries via mask */
  #log-section::before {
    content: '';
    position: absolute;
    top: 30px; left: 0; right: 0;
    height: 28px;
    background: linear-gradient(to bottom, var(--bg), transparent);
    pointer-events: none;
    z-index: 1;
  }

  /* ─── Footer ─── */
  #footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.52rem;
    letter-spacing: 0.18em;
    color: rgba(0,229,255,0.25);
    text-transform: uppercase;
  }

  #clock { font-variant-numeric: tabular-nums; }

  /* ─── Connection indicator ─── */
  #conn-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(0,229,255,0.25);
    margin-right: 5px;
    transition: background 0.4s, box-shadow 0.4s;
  }
  #conn-dot.live {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: connBlink 2s ease-in-out infinite;
  }
  @keyframes connBlink {
    0%,100% { opacity: 1; } 50% { opacity: 0.5; }
  }

</style>
</head>
<body>

<!-- Corner brackets -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div id="hud">

  <!-- Header -->
  <div id="header">
    <div id="title">JARVIS</div>
    <div id="subtitle">Just&nbsp;A&nbsp;Rather&nbsp;Very&nbsp;Intelligent&nbsp;System</div>
    <div id="status-bar">
      <div id="status-dot"></div>
      <div id="status-text">IDLE</div>
    </div>
  </div>

  <!-- Center ring + orb -->
  <div id="center">
    <!-- Flanking info panels -->
    <div id="panels">
      <div class="side-panel left">
        <div class="panel-line">SYS: ONLINE</div>
        <div class="panel-line">VOICE: ACTIVE</div>
        <div class="panel-line">BRAIN: CLAUDE</div>
        <div class="panel-line">NET: SECURE</div>
        <div class="panel-line" id="panel-uptime">UP: 00:00:00</div>
      </div>
      <div class="side-panel right">
        <div class="panel-line">AUDIO: READY</div>
        <div class="panel-line">TOOLS: LOADED</div>
        <div class="panel-line">MODE: VOICE</div>
        <div class="panel-line">ENC: AES-256</div>
        <div class="panel-line" id="panel-msgs">MSGS: 0</div>
      </div>
    </div>

    <div id="arc-container">
      <div class="arc-ring"></div>
      <div class="arc-ring"></div>
      <div class="arc-ring"></div>
      <div class="arc-ring"></div>
      <div id="orb"></div>
    </div>
  </div>

  <!-- Waveform -->
  <div id="waveform-section">
    <div id="waveform"></div>
  </div>

  <!-- Conversation log -->
  <div id="log-section">
    <div id="log-label"><span id="conn-dot"></span>Live&nbsp;Feed&nbsp;/&nbsp;Conversation</div>
    <div id="log"></div>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span>JARVIS &copy; Stark Industries</span>
    <span id="clock">--:--:--</span>
    <span>Peterson Automation v1.0</span>
  </div>

</div>

<script>
// ─── Waveform bars ───────────────────────────────────────────────
(function buildWaveform() {
  const BAR_COUNT = 32;
  const wf = document.getElementById('waveform');
  const heights = [];
  const durations = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    // Create a bell-curve-ish height distribution centred on middle
    const t = Math.abs(i - BAR_COUNT / 2) / (BAR_COUNT / 2); // 0=center, 1=edge
    const maxH = Math.round(12 + (1 - t * t) * 34); // 12–46 px
    const dur  = (0.55 + Math.random() * 0.7).toFixed(2) + 's';
    bar.style.setProperty('--h',   maxH + 'px');
    bar.style.setProperty('--dur', dur);
    heights.push(maxH);
    durations.push(dur);
    wf.appendChild(bar);
  }
})();

// ─── Clock ────────────────────────────────────────────────────────
function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 8);
}
setInterval(tickClock, 1000);
tickClock();

// ─── Uptime ───────────────────────────────────────────────────────
const startTime = Date.now();
setInterval(() => {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  document.getElementById('panel-uptime').textContent = `UP: ${h}:${m}:${sec}`;
}, 1000);

// ─── Status management ────────────────────────────────────────────
const STATUS_COLORS = {
  idle:      'var(--dim)',
  listening: 'var(--green)',
  thinking:  'var(--yellow)',
  speaking:  'var(--cyan)',
};
const STATUS_LABELS = {
  idle:      'IDLE',
  listening: 'LISTENING',
  thinking:  'PROCESSING',
  speaking:  'SPEAKING',
};

let currentStatus = 'idle';

function setStatus(s) {
  currentStatus = s;
  const color = STATUS_COLORS[s] || STATUS_COLORS.idle;
  const label = STATUS_LABELS[s] || s.toUpperCase();
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  dot.style.background  = color;
  dot.style.boxShadow   = `0 0 8px ${color}, 0 0 16px ${color}`;
  text.style.color      = color;
  text.textContent      = label;

  // Body class drives CSS animations
  document.body.className = '';
  if (s !== 'idle') document.body.classList.add(s);
}

setStatus('idle');

// ─── Conversation log ─────────────────────────────────────────────
const MAX_MESSAGES = 6;
let msgCount = 0;

function addMessage(role, text) {
  msgCount++;
  document.getElementById('panel-msgs').textContent = `MSGS: ${msgCount}`;

  const log = document.getElementById('log');
  const entry = document.createElement('div');
  const isJarvis = role.toLowerCase() === 'jarvis' || role.toLowerCase() === 'assistant';
  entry.className = 'log-entry' + (isJarvis ? ' jarvis-entry' : '');

  const roleEl = document.createElement('div');
  roleEl.className = 'log-role ' + (isJarvis ? 'jarvis' : 'user');
  roleEl.textContent = isJarvis ? 'JARVIS' : 'YOU';

  const textEl = document.createElement('div');
  textEl.className = 'log-text';
  textEl.textContent = text;

  entry.appendChild(roleEl);
  entry.appendChild(textEl);
  log.appendChild(entry);

  // Keep max 6 entries
  while (log.children.length > MAX_MESSAGES) {
    log.removeChild(log.firstChild);
  }

  // Scroll to bottom
  const section = document.getElementById('log-section');
  section.scrollTop = section.scrollHeight;
}

// ─── SSE connection ───────────────────────────────────────────────
const connDot = document.getElementById('conn-dot');

function connectSSE() {
  const src = new EventSource('/events');

  src.onopen = () => {
    connDot.classList.add('live');
  };

  src.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch { return; }

    if (data.type === 'status' && data.status) {
      setStatus(data.status);
    } else if (data.type === 'message' && data.role && data.text) {
      addMessage(data.role, data.text);
    } else if (data.type === 'ping') {
      // heartbeat — do nothing
    }
  };

  src.onerror = () => {
    connDot.classList.remove('live');
    src.close();
    // Retry after 3s
    setTimeout(connectSSE, 3000);
  };
}

connectSSE();
</script>
</body>
</html>
